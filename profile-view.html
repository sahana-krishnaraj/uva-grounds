<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — HoosOut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="home.html">
      <span class="logo-mark" aria-hidden="true">
        <img src="images/logo-mark.svg" width="38" height="38" alt="" />
      </span>
      <span class="logo-type">Hoos<span class="logo-type-accent">Out</span></span>
    </a>
    <nav class="nav-links">
      <a href="home.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">My Feed</a>
      <a href="events-map.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">Map</a>
      <a href="post.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">Create</a>
      <a href="messages.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">Messages</a>
      <a href="me.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">My profile</a>
      <a href="activity.html" class="btn btn-ghost btn-sm nav-activity-link" style="padding: 0.5rem 1rem"
        >Activity <span id="nav-activity-badge" class="nav-activity-badge" hidden></span></a
      >
      <a href="index.html" class="btn btn-primary btn-sm" style="padding: 0.5rem 1rem" id="nav-logout">Log out</a>
    </nav>
  </header>

  <main class="container me-page">
    <p style="margin-bottom: 1rem"><a href="home.html" class="btn btn-ghost btn-sm" style="padding: 0.35rem 0.75rem">← Back to feed</a></p>
    <section class="me-hero">
      <div class="me-hero-avatar profile-view-avatar" id="pv-avatar" aria-hidden="true">
        <img class="js-pv-avatar-img me-hero-avatar-img" alt="" hidden />
        <span class="js-pv-avatar-fallback">?</span>
      </div>
      <div class="me-hero-text">
        <h1 class="me-hero-name" id="pv-name">…</h1>
        <p class="me-hero-handle" id="pv-handle">…</p>
        <div class="pv-stats" id="pv-stats">
          <button type="button" class="pv-stat-btn" id="pv-btn-followers">
            <span class="pv-stat-num" id="pv-count-followers">0</span>
            <span class="pv-stat-label">followers</span>
          </button>
          <button type="button" class="pv-stat-btn" id="pv-btn-following">
            <span class="pv-stat-num" id="pv-count-following">0</span>
            <span class="pv-stat-label">following</span>
          </button>
        </div>
        <div class="profile-view-actions" style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem">
          <button type="button" class="btn btn-primary btn-sm js-follow-btn btn-follow-pill" id="pv-follow" hidden>Follow</button>
          <a class="btn btn-ghost btn-sm" id="pv-message" href="#" hidden>Message</a>
          <button type="button" class="btn btn-ghost btn-sm" id="pv-report-btn">Report user</button>
          <button type="button" class="btn btn-ghost btn-sm" id="pv-block-btn">Block user</button>
        </div>
      </div>
    </section>

    <section class="me-bio-section">
      <div class="me-bio-grid">
        <div class="me-bio-item js-pv-bio" hidden>
          <span class="me-bio-label">About:</span>
          <span class="me-bio-value"></span>
        </div>
        <div class="me-bio-item js-pv-interests" hidden>
          <span class="me-bio-label">Interests:</span>
          <span class="me-bio-value"></span>
        </div>
        <div class="me-bio-item js-pv-location" hidden>
          <span class="me-bio-label">Location:</span>
          <span class="me-bio-value"></span>
        </div>
      </div>
    </section>

    <section class="pv-events-section">
      <h2 class="me-panel-title">Events they posted</h2>
      <div id="pv-events-mount" class="pv-events-scroll"></div>
      <p id="pv-events-empty" class="me-empty" hidden>No events posted yet.</p>
    </section>
  </main>

  <dialog id="pv-dialog" class="pv-dialog">
    <div class="pv-dialog-surface">
      <div class="pv-dialog-head">
        <h2 id="pv-dialog-title" class="pv-dialog-title">Followers</h2>
        <button type="button" class="btn btn-ghost btn-sm" id="pv-dialog-close">Close</button>
      </div>
      <div id="pv-dialog-body" class="pv-dialog-body"></div>
    </div>
  </dialog>

  <script src="js/session.js"></script>
  <script type="module" src="js/profile-view.js"></script>
</body>
</html>
