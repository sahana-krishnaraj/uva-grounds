<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — HoosOut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="home.html">
      <span class="logo-mark" aria-hidden="true"><img src="images/logo-mark.svg" width="38" height="38" alt="" /></span>
      <span class="logo-type">Hoos<span class="logo-type-accent">Out</span></span>
    </a>
    <nav class="nav-links">
      <a href="home.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">My Feed</a>
      <a href="events-map.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">Map</a>
      <a href="messages.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">Messages</a>
      <a href="me.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">Profile</a>
      <a href="index.html" class="btn btn-primary btn-sm" style="padding: 0.5rem 1rem" id="nav-logout">Log out</a>
    </nav>
  </header>

  <main class="container" style="max-width: 760px">
    <h1 class="section-title" style="text-align: left; margin-bottom: 0.4rem">Settings</h1>
    <p class="section-sub" style="text-align: left; margin-bottom: 1rem">Manage your account, privacy, and app preferences.</p>
    <p id="settings-status" class="auth-form-msg" style="display:none;margin:0 0 1rem"></p>

    <div class="settings-sections">
      <section class="settings-section">
        <h3>Theme</h3>
        <p class="section-sub" style="margin:0">HoosOut uses a dark theme only.</p>
      </section>

      <section class="settings-section">
        <h3>Profile</h3>
        <div class="profile-photo-setup" style="margin-bottom: 1rem">
          <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
            <div class="me-hero-avatar profile-setup-avatar" data-hoosout-profile-avatar style="width:72px;height:72px;font-size:0.85rem">
              <img class="js-hoosout-avatar-img me-hero-avatar-img" alt="" hidden />
              <span class="js-hoosout-avatar-fallback">You</span>
            </div>
            <div class="me-photo-toolbar" style="margin:0">
              <input type="file" class="js-profile-photo-file" accept="image/*" hidden />
              <button type="button" class="btn btn-ghost btn-sm js-profile-photo-change">Upload photo</button>
              <button type="button" class="btn btn-ghost btn-sm js-profile-photo-remove">Remove</button>
            </div>
          </div>
        </div>
        <form class="form-grid" id="settings-form">
          <div class="two-col">
            <div><label for="first-name">First name *</label><input id="first-name" type="text" required /></div>
            <div><label for="last-name">Last name *</label><input id="last-name" type="text" required /></div>
          </div>
          <div class="two-col">
            <div><label for="preferred-name">Username *</label><input id="preferred-name" type="text" maxlength="7" required /></div>
            <div><label for="year">Year *</label><select id="year" required><option value="">Select</option><option>First year</option><option>Second year</option><option>Third year</option><option>Fourth year</option><option>Grad</option></select></div>
          </div>
          <div><label for="pronouns">Pronouns</label><input id="pronouns" type="text" placeholder="e.g. she/her" /></div>
          <div><label for="bio">About</label><textarea id="bio"></textarea></div>
          <div class="two-col">
            <div><label for="location-dorm">Location / dorm</label><input id="location-dorm" type="text" /></div>
            <div><label for="interests">Interests</label><input id="interests" type="text" /></div>
          </div>
          <div><label for="schedule">Availability</label><input id="schedule" type="text" /></div>
          <button type="submit" class="btn btn-primary">Save profile changes</button>
        </form>
      </section>

      <section class="settings-section">
        <h3>Account</h3>
        <form class="form-grid" id="account-form">
          <div><label for="account-email">Email</label><input id="account-email" type="email" /></div>
          <div class="two-col">
            <div><label for="new-password">New password</label><input id="new-password" type="password" minlength="8" /></div>
            <div><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" minlength="8" /></div>
          </div>
          <button type="submit" class="btn btn-ghost">Update account</button>
        </form>
      </section>

      <section class="settings-section">
        <h3>Notifications</h3>
        <label class="settings-row"><span>RSVPs</span><input id="notify-rsvp" type="checkbox" /></label>
        <label class="settings-row"><span>Likes</span><input id="notify-likes" type="checkbox" /></label>
        <label class="settings-row"><span>Comments</span><input id="notify-comments" type="checkbox" /></label>
        <label class="settings-row"><span>Messages</span><input id="notify-messages" type="checkbox" /></label>
        <label class="settings-row"><span>New followers</span><input id="notify-followers" type="checkbox" /></label>
      </section>

      <section class="settings-section">
        <h3>Privacy</h3>
        <label for="profile-visibility">Profile visibility</label>
        <select id="profile-visibility">
          <option value="public">Visible to everyone</option>
          <option value="following_only">Visible only to people I follow</option>
        </select>
      </section>

      <section class="settings-section">
        <h3>Blocked users</h3>
        <div id="blocked-users-list"></div>
      </section>

      <section class="settings-section">
        <h3>Help & feedback</h3>
        <form class="form-grid" id="feedback-form">
          <textarea id="feedback-message" placeholder="Share feedback or ask for help"></textarea>
          <button type="submit" class="btn btn-ghost">Send feedback</button>
        </form>
      </section>

      <section class="settings-section">
        <h3>Danger zone</h3>
        <button id="delete-account-btn" type="button" class="btn btn-ghost">Delete my account</button>
      </section>

      <section class="settings-section">
        <h3>About</h3>
        <p style="margin:.2rem 0;color:var(--text-muted)">Version: v0.8.0</p>
        <p style="margin:.2rem 0"><a href="https://example.com/terms" target="_blank" rel="noopener">Terms of service</a> · <a href="https://example.com/privacy" target="_blank" rel="noopener">Privacy policy</a></p>
      </section>
    </div>
  </main>

  <script src="js/session.js"></script>
  <script src="js/profile-photo.js"></script>
  <script type="module" src="js/settings-init.js"></script>
</body>
</html>
