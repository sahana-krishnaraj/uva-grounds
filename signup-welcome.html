<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome — HoosOut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="home.html">
      <span class="logo-mark" aria-hidden="true">
        <img src="images/logo-mark.svg" width="38" height="38" alt="" />
      </span>
      <span class="logo-type">Hoos<span class="logo-type-accent">Out</span></span>
    </a>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <h1>You’re in!</h1>
      <p class="auth-lead">
        Add a bit more about yourself now, or head to the feed and finish your profile later. You’ll need a complete profile before you can post, RSVP, comment, or like.
      </p>
      <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem">
        <a class="btn btn-primary btn-full" href="profile.html">Set up my profile</a>
        <a class="btn btn-ghost btn-full" href="home.html">Skip for now</a>
      </div>
    </div>
  </main>
  <script src="js/session.js"></script>
</body>
</html>
