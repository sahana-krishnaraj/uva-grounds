<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clubs moved — HoosOut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="home.html">
      <span class="logo-mark" aria-hidden="true"><img src="images/logo-mark.svg" width="38" height="38" alt="" /></span>
      <span class="logo-type">Hoos<span class="logo-type-accent">Out</span></span>
    </a>
    <nav class="nav-links">
      <a href="home.html" class="btn btn-ghost btn-sm" style="padding:.5rem 1rem">My Feed</a>
      <a href="clubs.html" class="btn btn-primary btn-sm" style="padding:.5rem 1rem">Clubs</a>
      <a href="post.html" class="btn btn-ghost btn-sm" style="padding:.5rem 1rem">Create</a>
      <a href="index.html" class="btn btn-ghost btn-sm" style="padding:.5rem 1rem" id="nav-logout">Log out</a>
    </nav>
  </header>
  <main class="container" style="max-width:720px">
    <div class="auth-card" style="box-shadow:none">
      <h1 style="margin-top:0">UVA Events page moved</h1>
      <p class="hub-card-meta">Clubs and organizations now live natively in HoosOut.</p>
      <p class="hub-card-meta">Browse clubs, follow them, and discover their events in your main feed.</p>
      <div class="hub-card-actions">
        <a href="clubs.html" class="btn btn-primary btn-sm">Open Clubs Directory</a>
        <a href="home.html" class="btn btn-ghost btn-sm">Back to Feed</a>
      </div>
    </div>
  </main>
  <script src="js/session.js"></script>
  <script type="module">
    import { supabase } from "./js/supabase.js";
    document.getElementById("nav-logout")?.addEventListener("click", async () => {
      await supabase.auth.signOut();
      if (window.HoosOutSession) window.HoosOutSession.signOut();
    });
  </script>
</body>
</html>
