<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — HoosOut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="home.html">
      <span class="logo-mark" aria-hidden="true">
        <img src="images/logo-mark.svg" width="38" height="38" alt="" />
      </span>
      <span class="logo-type">Hoos<span class="logo-type-accent">Out</span></span>
    </a>
    <nav class="nav-links">
      <a
        href="clubs.html"
        class="btn btn-ghost btn-sm"
        style="padding: 0.5rem 1rem"
        id="nav-uva-cville"
        hidden
        >Clubs</a>
      <a href="events-map.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">Map</a>
      <a href="post.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">Create</a>
      <a href="messages.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">Messages</a>
      <a href="me.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">Profile</a>
      <a href="settings.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">Settings</a>
      <a href="index.html" class="btn btn-primary btn-sm" style="padding: 0.5rem 1rem" id="nav-logout">Log out</a>
    </nav>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Join the UVA network!</h1>
      <p class="auth-lead">Create an account with your @virginia.edu email.</p>

      <form id="signup-form" class="form-grid" novalidate>
        <div class="two-col">
          <div>
            <label for="first-name">First name <span class="req-mark" aria-hidden="true">*</span></label>
            <input id="first-name" name="first_name" type="text" autocomplete="given-name" required />
          </div>
          <div>
            <label for="last-name">Last name <span class="req-mark" aria-hidden="true">*</span></label>
            <input id="last-name" name="last_name" type="text" autocomplete="family-name" required />
          </div>
        </div>
        <div>
          <label for="username">Username <span class="req-mark" aria-hidden="true">*</span></label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
            pattern="[a-zA-Z0-9._-]{2,32}"
            title="2–32 characters: letters, numbers, dot, underscore, or hyphen"
            placeholder="your.handle"
          />
        </div>
        <div>
          <label for="email">UVA email <span class="req-mark" aria-hidden="true">*</span></label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@virginia.edu"
            required
            pattern=".+@virginia\.edu$"
            title="Must be a @virginia.edu address"
          />
        </div>
        <div>
          <label for="password">Password <span class="req-mark" aria-hidden="true">*</span></label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            placeholder="At least 8 characters"
            required
            minlength="8"
          />
        </div>
        <div>
          <label for="password-confirm">Confirm password <span class="req-mark" aria-hidden="true">*</span></label>
          <input
            id="password-confirm"
            name="password-confirm"
            type="password"
            autocomplete="new-password"
            placeholder="Re-enter password"
            required
            minlength="8"
          />
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="signup-submit">Create account</button>
      </form>

      <p id="signup-msg" class="auth-form-msg" style="display: none; margin-top: 0.75rem; font-size: 0.88rem"></p>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </main>

  <script src="js/session.js"></script>
  <script type="module">
    import { supabase } from "./js/supabase.js";

    var form = document.getElementById("signup-form");
    var msg = document.getElementById("signup-msg");
    var btn = document.getElementById("signup-submit");

    function showError(text) {
      msg.style.display = "";
      msg.style.color = "red";
      msg.textContent = text;
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      msg.style.display = "none";

      var firstName = document.getElementById("first-name").value.trim();
      var lastName = document.getElementById("last-name").value.trim();
      var username = document.getElementById("username").value.trim();
      var email = document.getElementById("email").value.trim();
      var pw = document.getElementById("password").value;
      var pw2 = document.getElementById("password-confirm").value;

      if (!firstName || !lastName || !username) {
        showError("First name, last name, and username are required.");
        return;
      }
      if (pw !== pw2) {
        showError("Passwords do not match.");
        return;
      }
      if (pw.length < 8) {
        showError("Password must be at least 8 characters.");
        return;
      }

      if (!form.reportValidity()) return;

      btn.disabled = true;
      btn.textContent = "Creating account…";

      const localPart = email.split("@")[0] || "";

      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: pw,
        options: {
          data: {
            first_name: firstName,
            last_name: lastName,
            preferred_name: username,
            computing_id: localPart,
          },
        },
      });

      if (error) {
        showError(error.message || "Could not sign up. Try again.");
        btn.disabled = false;
        btn.textContent = "Create account";
        return;
      }

      let session = data.session;
      if (!session) {
        const signInRes = await supabase.auth.signInWithPassword({ email: email, password: pw });
        if (signInRes.error || !signInRes.data.session) {
          showError(
            "If email confirmation is required, check your inbox and then log in. Otherwise try again."
          );
          btn.disabled = false;
          btn.textContent = "Create account";
          return;
        }
        session = signInRes.data.session;
      }

      const uid = session.user.id;
      const { error: pe } = await supabase.from("profiles").upsert(
        {
          id: uid,
          first_name: firstName,
          last_name: lastName,
          preferred_name: username,
          computing_id: localPart,
        },
        { onConflict: "id" }
      );
      if (pe) {
        console.warn("HoosOut: profile seed after signup", pe.message);
      }

      if (window.HoosOutSession) window.HoosOutSession.signIn();
      window.location.href = "signup-welcome.html";
    });
  </script>
</body>
</html>
