<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event details — HoosOut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="home.html">
      <span class="logo-mark" aria-hidden="true">
        <img src="images/logo-mark.svg" width="38" height="38" alt="" />
      </span>
      <span class="logo-type">Hoos<span class="logo-type-accent">Out</span></span>
    </a>
    <nav class="nav-links">
      <a href="home.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">My Feed</a>
      <a href="events-map.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">Map</a>
      <a href="post.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">Create</a>
      <a href="messages.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">Messages</a>
      <a href="me.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">Profile</a>
      <a href="index.html" class="btn btn-primary btn-sm" style="padding: 0.5rem 1rem" id="nav-logout">Log out</a>
    </nav>
  </header>

  <main class="container" style="max-width: 760px; padding-top: 1rem">
    <a href="home.html" class="btn btn-ghost btn-sm" style="margin-bottom: 0.8rem">← Back to feed</a>
    <button id="ed-report-btn" type="button" class="btn btn-ghost btn-sm" style="margin-left:0.5rem;margin-bottom:0.8rem">Report this post</button>
    <article class="auth-card" style="box-shadow:none">
      <h1 id="ed-title" style="margin:0 0 0.4rem">Loading…</h1>
      <p id="ed-meta" style="margin:0;color:var(--text-muted)"></p>
      <p id="ed-body" style="margin-top:0.85rem;white-space:pre-wrap"></p>
      <div id="ed-owner-rsvp" hidden style="margin-top:1rem">
        <h3 style="margin:0 0 0.4rem">RSVP management</h3>
        <p id="ed-going-count" style="margin:0 0 0.35rem;color:var(--text-muted)"></p>
        <div class="two-col" style="align-items:flex-start">
          <div>
            <p style="margin:0 0 0.25rem;font-weight:700">Responded</p>
            <ul id="ed-responded" class="event-attendees-list" style="margin:0"></ul>
          </div>
          <div>
            <p style="margin:0 0 0.25rem;font-weight:700">Not responded yet</p>
            <ul id="ed-pending" class="event-attendees-list" style="margin:0"></ul>
          </div>
        </div>
      </div>
    </article>
  </main>

  <script src="js/session.js"></script>
  <script type="module" src="js/event-detail.js"></script>
</body>
</html>
