<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — HoosOut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="home.html">
      <span class="logo-mark" aria-hidden="true">
        <img src="images/logo-mark.svg" width="38" height="38" alt="" />
      </span>
      <span class="logo-type">Hoos<span class="logo-type-accent">Out</span></span>
    </a>
    <nav class="nav-links">
      <a href="home.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">My Feed</a>
      <a href="post.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">Create</a>
      <a href="me.html" class="btn btn-ghost btn-sm" style="padding: 0.5rem 1rem">Profile</a>
      <a href="index.html" class="btn btn-primary btn-sm" style="padding: 0.5rem 1rem" id="nav-logout">Log out</a>
    </nav>
  </header>

  <main class="container" style="max-width: 1100px; padding-top: 1rem">
    <h1 class="section-title" style="text-align: left; margin-bottom: 1rem; font-size: 1.35rem">Messages</h1>
    <div class="messages-layout">
      <aside class="messages-sidebar" aria-label="Conversations">
        <div class="messages-search">
          <input type="search" id="msg-user-search" placeholder="Search by name to start a chat…" autocomplete="off" aria-label="Find a student" />
        </div>
        <div id="messages-user-hits" class="messages-user-hits" hidden></div>
        <div id="messages-convo-list" class="messages-convo-list" role="list"></div>
      </aside>
      <section class="messages-main" aria-label="Conversation">
        <div id="messages-thread-header" class="messages-thread-header" hidden></div>
        <div id="messages-thread-scroll" class="messages-thread-scroll"></div>
        <div id="messages-empty" class="messages-empty-state">Select a conversation or search for someone.</div>
        <form id="messages-compose-form" class="messages-compose" hidden>
          <textarea id="messages-input" rows="2" placeholder="Message…"></textarea>
          <button type="submit" class="btn btn-primary">Send</button>
        </form>
      </section>
    </div>
  </main>

  <footer class="footer-site">
    HoosOut · Messages are private between you and the other person.
  </footer>

  <script src="js/session.js"></script>
  <script type="module" src="js/messages-page.js"></script>
</body>
</html>
